name: ci
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
env:
  PACKAGE_NAME: ${{ github.event.repository.name }}
  PACKAGE_VERSION: ${{ github.sha }}
  MYCI_NEXUS_USERNAME: cppfw
  MYCI_NEXUS_PASSWORD: ${{ secrets.MYCI_NEXUS_PASSWORD }}
  MYCI_GIT_USERNAME: igagis
  MYCI_GIT_PASSWORD: ${{ secrets.MYCI_GIT_ACCESS_TOKEN }}
  MYCI_CONAN_REMOTE: https://gagis.hopto.org/conan
  MYCI_CONAN_USER: cppfw
  MYCI_CONAN_PASSWORD: ${{ secrets.MYCI_CONAN_PASSWORD }}
jobs:
##### msys2 #####
  msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - {arch: i686, repo: mingw32}
          - {arch: x86_64, repo: mingw64}
    name: msys2 | ${{ matrix.repo }}
    steps:
    - name: make msys2 to provide the default shell
      uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: MSYS
        install: >-
          msys2-devel
          mingw-w64-${{ matrix.arch }}-toolchain
    - name: add cppfw pacman msys repo
      uses: myci-actions/add-pacman-repo@main
      with:
        name: cppfw_msys
        url: https://gagis.hopto.org/repo/cppfw/msys2/msys
        shell: 'msys2 {0}'
        key-server: https://gagis.hopto.org/repo/cppfw/pubkey.gpg
        install: myci
    - name: add cppfw pacman msys/mingw repo
      uses: myci-actions/add-pacman-repo@main
      with:
        name: cppfw_${{ matrix.repo }}
        url: https://gagis.hopto.org/repo/cppfw/msys2/${{ matrix.repo }}
        shell: 'msys2 {0}'
        key-server: https://gagis.hopto.org/repo/cppfw/pubkey.gpg
    - name: git clone
      uses: myci-actions/checkout@main
    - name: prepare pacman package
      run: myci-apply-version.sh --version $(myci-deb-version.sh) build/msys2/PKGBUILD.in
    - name: build
      # to make makepkg-mingw build only one architecture we need to set the MINGW_INSTALLS
      env: {MINGW_INSTALLS: '${{ matrix.repo }}'}
      run: |
        cd build/msys2
        PKGEXT='.pkg.tar.xz' makepkg-mingw --syncdeps --noconfirm --skipinteg
    - name: deploy
      run: |
        echo "${{ secrets.MYCI_REPO_SSH_KEY }}" > repo_key_rsa && chmod 600 repo_key_rsa
        for f in $(find build/msys2 -name "mingw-w64-${{ matrix.arch }}-$PACKAGE_NAME-*-any.pkg.*"); do
          myci-deploy-pacman-ssh.sh --server gagis.hopto.org --key repo_key_rsa --repo cppfw/msys2/${{ matrix.repo }} --database cppfw_${{ matrix.repo }} $f
        done
      if: startsWith(github.ref, 'refs/tags/')
##### vcpkg-windows #####
  vcpkg-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    strategy:
      fail-fast: false
      matrix:
        config:
          - Debug
          - Release
        arch:
          - Win32
          - x64
    name: vcpkg - windows - ${{ matrix.arch }} | ${{ matrix.config }}
    steps:
    - name: git clone
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: get myci scripts
      uses: actions/checkout@v4
      with:
        repository: cppfw/myci
        ref: latest
        path: myci
    - name: add myci to PATH
      uses: myci-actions/export-env-var-powershell@main
      with: {name: PATH, value: "$env:Path;myci/src/powershell"}
    - name: set VCPKG_ROOT
      uses: myci-actions/export-env-var-powershell@main
      # accorging to github actions windows image docs, it should define VCPKG_INSTALLATION_ROOT env var,
      # but on practice it is not set, so specify vcpkg root path explicitly
      with: {name: VCPKG_ROOT, value: "C:/vcpkg/"}
    - name: make local symbolic link to VCPKG installation directory
      # this is needed at least for actions/upload-artifact to be able to find vcpkg install logs
      shell: powershell
      run: New-Item -ItemType SymbolicLink -Path vcpkg-installation -Target $env:VCPKG_ROOT
    - name: prepare vcpkg port
      run: myci-vcpkg-prepare.ps1 -gitref ${{ github.sha }}
    - name: test vcpkg port - build
      run: |
        cd build/vcpkg/test
        cmake . -A ${{ matrix.arch }}
        cmake --build . --parallel --config ${{ matrix.config }}
    - name: test vcpkg port - test
      run: |
        cd build/vcpkg/test
        ./${{ matrix.config }}/test.exe
    - name: upload vcpkg logs to artifacts
      if: always() # even if previous steps fail, this one needs to be run
      uses: actions/upload-artifact@v4
      with:
        name: vcpkg_windows_${{ matrix.arch }}_${{ matrix.config }}_logs
        # NOTE: upload only first level buildtrees subdir logs: on windows actions/upload-artifact fails with a stat() EPERM error when traversing too deep into dependency source trees
        path: |
          vcpkg-installation/buildtrees/*/*.log
          vcpkg-installation/buildtrees/*/*.txt
          build/vcpkg/**/*.log
        if-no-files-found: warn
